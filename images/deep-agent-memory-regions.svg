<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">Where each kind of agent memory lives</title>
  <desc id="desc">Two columns. On the left, the system message the model sees on every call, assembled from the authored system prompt plus a skills index appended by SkillsMiddleware and an agent_memory block appended by MemoryMiddleware. On the right, the virtual filesystem, whose paths route to durable per-user, per-org, and per-thread backends. Solid arrows show content loaded into the prompt automatically; dashed arrows show content fetched by a tool call only when the model asks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .zone { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; }
      .zone-label { font: 700 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: .08em; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.5; }
      .primary { fill: #eff6ff; stroke: #3b82f6; }
      .durable { fill: #ecfdf5; stroke: #10b981; }
      .ondemand { fill: #fffbeb; stroke: #f59e0b; }
      .ephemeral { fill: #f1f5f9; stroke: #94a3b8; }
      .node-title { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .node-text { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .mono-sm { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #475569; }
      .small { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-muted { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 7 7; marker-end: url(#arrow-muted); }
      .edge-label { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .pill { fill: #e2e8f0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="880"/>

  <text x="600" y="58" text-anchor="middle" class="title">Where Agent Memory Lives</text>
  <text x="600" y="88" text-anchor="middle" class="subtitle">One virtual filesystem, four storage scopes — and only some of it reaches the prompt</text>

  <g id="workspace" transform="translate(50 120)">
    <rect class="zone" x="0" y="0" width="1100" height="720" rx="30"/>

    <!-- ================= LEFT: the assembled system message ================= -->
    <text x="24" y="40" class="zone-label">IN CONTEXT — EVERY MODEL CALL</text>

    <g id="system-message">
      <rect class="node primary" x="24" y="56" width="470" height="470" rx="24"/>
      <text x="259" y="86" text-anchor="middle" class="node-title" font-size="18">System message</text>
      <text x="259" y="106" text-anchor="middle" class="small">reassembled on every call · costs tokens every turn</text>

      <!-- authored prompt -->
      <g transform="translate(48 122)">
        <rect class="node" width="422" height="84" rx="16"/>
        <text x="16" y="28" class="mono">system_prompt=</text>
        <text x="16" y="52" class="node-text">Your authored instructions.</text>
        <text x="16" y="70" class="small">Set once, at build time</text>
      </g>

      <!-- skills index -->
      <g transform="translate(48 222)">
        <rect class="node ondemand" width="422" height="112" rx="16"/>
        <text x="16" y="28" class="mono">&lt;skills index&gt;</text>
        <text x="16" y="52" class="node-text">
          <tspan x="16" dy="0">One line per skill: name + description.</tspan>
          <tspan x="16" dy="18">Bodies are deliberately NOT here.</tspan>
        </text>
        <text x="16" y="98" class="small">Appended by SkillsMiddleware · frontmatter scanned at startup</text>
      </g>

      <!-- agent memory -->
      <g transform="translate(48 350)">
        <rect class="node durable" width="422" height="152" rx="16"/>
        <text x="16" y="28" class="mono">&lt;agent_memory&gt;</text>
        <text x="16" y="52" class="node-text">
          <tspan x="16" dy="0">The full text of every file in memory=[…],</tspan>
          <tspan x="16" dy="18">wrapped with guidelines telling the model to</tspan>
          <tspan x="16" dy="18">treat it as data, not as hidden instructions.</tspan>
        </text>
        <text x="16" y="126" class="small">Appended by MemoryMiddleware · files read once per run</text>
        <text x="16" y="142" class="small">(before_agent), then re-appended to every call</text>
      </g>
    </g>

    <!-- the model -->
    <g id="model" transform="translate(104 566)">
      <rect class="node" width="310" height="76" rx="18"/>
      <text x="155" y="32" text-anchor="middle" class="node-title" font-size="17">Model</text>
      <text x="155" y="56" text-anchor="middle" class="node-text">reads the assembled message, then acts</text>
    </g>
    <path class="edge" d="M 259 526 L 259 566"/>

    <!-- ================= RIGHT: the virtual filesystem ================= -->
    <text x="640" y="40" class="zone-label">ON DISK — ONE TREE, FOUR DESTINATIONS</text>

    <g transform="translate(640 56)">
      <rect class="node ondemand" width="436" height="118" rx="18"/>
      <text x="18" y="30" class="mono">/skills/&lt;name&gt;/SKILL.md</text>
      <text x="18" y="54" class="node-text">
        <tspan x="18" dy="0">Procedural memory. Only the frontmatter is</tspan>
        <tspan x="18" dy="18">indexed; the body is read when a task matches.</tspan>
      </text>
      <rect x="18" y="80" width="400" height="24" rx="12" class="pill"/>
      <text x="30" y="97" class="mono-sm">StoreBackend · ("user-alice", "skills")</text>
    </g>

    <g transform="translate(640 190)">
      <rect class="node durable" width="436" height="104" rx="18"/>
      <text x="18" y="30" class="mono">/memories/preferences.md</text>
      <text x="18" y="54" class="node-text">Per-user semantic memory. Agent-writable.</text>
      <rect x="18" y="66" width="400" height="24" rx="12" class="pill"/>
      <text x="30" y="83" class="mono-sm">StoreBackend · ("user-alice", "memories")</text>
    </g>

    <g transform="translate(640 310)">
      <rect class="node durable" width="436" height="104" rx="18"/>
      <text x="18" y="30" class="mono">/policies/compliance.md</text>
      <text x="18" y="54" class="node-text">Org-wide rules. Writes denied by permission.</text>
      <rect x="18" y="66" width="400" height="24" rx="12" class="pill"/>
      <text x="30" y="83" class="mono-sm">StoreBackend · ("acme-corp", "policies")</text>
    </g>

    <g transform="translate(640 430)">
      <rect class="node ephemeral" width="436" height="104" rx="18"/>
      <text x="18" y="30" class="mono">/workspace/… · offloaded results</text>
      <text x="18" y="54" class="node-text">Anything matching no route. Never in the prompt.</text>
      <rect x="18" y="66" width="400" height="24" rx="12" class="pill"/>
      <text x="30" y="83" class="mono-sm">StateBackend · thread-scoped, dies with the thread</text>
    </g>

    <!-- filesystem tools -->
    <g transform="translate(640 566)">
      <rect class="node" width="436" height="76" rx="18"/>
      <text x="218" y="30" text-anchor="middle" class="node-title" font-size="17">Filesystem tools</text>
      <text x="218" y="56" text-anchor="middle" class="mono-sm">ls · read_file · write_file · edit_file · glob · grep</text>
    </g>
    <path class="edge-muted" d="M 858 566 L 858 542"/>
    <text x="872" y="560" class="edge-label">any path in the tree</text>

    <!-- ================= edges: disk -> prompt ================= -->
    <path class="edge" d="M 640 115 C 588 115, 536 246, 474 278"/>
    <text x="561" y="171" text-anchor="middle" class="edge-label">skills=[…]</text>

    <path class="edge" d="M 640 242 C 588 242, 536 374, 474 402"/>
    <text x="561" y="297" text-anchor="middle" class="edge-label">memory=[…]</text>

    <path class="edge" d="M 640 362 C 592 362, 540 432, 474 448"/>
    <text x="564" y="385" text-anchor="middle" class="edge-label">memory=[…]</text>

    <!-- model -> tools -->
    <path class="edge-muted" d="M 414 604 L 640 604"/>
    <text x="527" y="594" text-anchor="middle" class="edge-label">tool call, on demand</text>

    <!-- ================= legend ================= -->
    <g transform="translate(24 664)">
      <path d="M 4 10 L 52 10" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
      <text x="64" y="15" class="small">Loaded for you — in the prompt before the model runs</text>
      <path d="M 4 38 L 52 38" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 7" fill="none" marker-end="url(#arrow-muted)"/>
      <text x="64" y="43" class="small">Fetched only if the model asks for it — a skill body, or any other file</text>
    </g>
  </g>
</svg>
