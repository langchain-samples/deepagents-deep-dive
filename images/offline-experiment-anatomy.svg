<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">The four moving parts of an offline experiment</title>
  <desc id="desc">A dataset holds examples, each example pairing one support ticket as inputs with a label and priority as reference outputs. An arrow labelled one call per example leads from the dataset into a dashed container labelled Experiment. Inside that container, a chain runs left to right: the target function, then a Run holding outputs and a trace, then the evaluators, then the feedback scores attached to the run. A footnote below notes that the target is typically the agent itself, wrapped just enough to accept a dataset example and hand the evaluators what they need.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .zone { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2; rx: 28; }
      .zone-label { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; letter-spacing: .08em; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.5; rx: 18; }
      .primary { fill: #eff6ff; stroke: #3b82f6; }
      .result { fill: #fffbeb; stroke: #f59e0b; }
      .evaluator { fill: #faf5ff; stroke: #a855f7; }
      .dashed { fill: #ffffff; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .row { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .node-title { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .node-text { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .mono { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .mono-sm { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .small { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-label { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .footnote { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .fnmark { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="780"/>

  <text x="600" y="62" text-anchor="middle" class="title">Anatomy of an Offline Experiment</text>
  <text x="600" y="92" text-anchor="middle" class="subtitle">A dataset holds examples; an experiment turns every example into a run; evaluators score every run</text>

  <g id="workspace" transform="translate(50 130)">

    <!-- Dataset -->
    <g id="dataset" transform="translate(60 8)">
      <rect class="node" width="980" height="294" rx="20"/>
      <text x="28" y="36" class="node-title">Dataset</text>
      <text x="28" y="60" class="mono-sm">deepagents-support-triage-evals-v3</text>
      <text x="952" y="36" text-anchor="end" class="small">versioned &#8226; 6 examples &#8226; lives in LangSmith</text>

      <text x="385" y="80" text-anchor="middle" class="zone-label">INPUTS</text>
      <text x="765" y="80" text-anchor="middle" class="zone-label">REFERENCE OUTPUTS</text>

      <g>
        <rect class="row" x="28" y="90" width="924" height="28" rx="8"/>
        <text x="46" y="109" class="small">Example 1</text>
        <text x="385" y="109" text-anchor="middle" class="mono-sm">{"id": "T-101", "subject": ..., "body": ...}</text>
        <text x="765" y="109" text-anchor="middle" class="mono-sm">{"label": "billing", "priority": "P2"}</text>
      </g>
      <g>
        <rect class="row" x="28" y="122" width="924" height="28" rx="8"/>
        <text x="46" y="141" class="small">Example 2</text>
        <text x="385" y="141" text-anchor="middle" class="mono-sm">{"id": "T-102", "subject": ..., "body": ...}</text>
        <text x="765" y="141" text-anchor="middle" class="mono-sm">{"label": "bug", "priority": "P1"}</text>
      </g>
      <g>
        <rect class="row" x="28" y="154" width="924" height="28" rx="8"/>
        <text x="46" y="173" class="small">Example 3</text>
        <text x="385" y="173" text-anchor="middle" class="mono-sm">{"id": "T-201", "subject": ..., "body": ...}</text>
        <text x="765" y="173" text-anchor="middle" class="mono-sm">{"label": "how-to", "priority": "P3"}</text>
      </g>
      <g>
        <rect class="row" x="28" y="186" width="924" height="28" rx="8"/>
        <text x="46" y="205" class="small">Example 4</text>
        <text x="385" y="205" text-anchor="middle" class="mono-sm">{"id": "T-301", "subject": ..., "body": ...}</text>
        <text x="765" y="205" text-anchor="middle" class="mono-sm">{"label": "security", "priority": "P1"}</text>
      </g>
      <g>
        <rect class="row" x="28" y="218" width="924" height="28" rx="8"/>
        <text x="46" y="237" class="small">Example 5</text>
        <text x="385" y="237" text-anchor="middle" class="mono-sm">{"id": "T-302", "subject": ..., "body": ...}</text>
        <text x="765" y="237" text-anchor="middle" class="mono-sm">{"label": "billing", "priority": "P2"}</text>
      </g>
      <g>
        <rect class="row" x="28" y="250" width="924" height="28" rx="8"/>
        <text x="46" y="269" class="small">Example 6</text>
        <text x="385" y="269" text-anchor="middle" class="mono-sm">{"id": "T-402", "subject": ..., "body": ...}</text>
        <text x="765" y="269" text-anchor="middle" class="mono-sm">{"label": "bug", "priority": "P2"}</text>
      </g>
    </g>

    <path class="edge" d="M 550 302 L 550 350"/>
    <text x="566" y="332" class="edge-label">one call per example</text>

    <!-- Experiment -->
    <g id="experiment" transform="translate(60 350)">
      <rect class="dashed" width="980" height="200" rx="20"/>
      <text x="30" y="34" class="node-title" style="font-size:18px">Experiment</text>
      <text x="30" y="56" class="node-text">One pass of one configuration over every example in the dataset</text>

      <g id="target" transform="translate(30 76)">
        <rect class="node primary" width="210" height="100" rx="18"/>
        <text x="105" y="34" text-anchor="middle" class="mono" style="font-size:16px">target(inputs)<tspan class="fnmark" dy="-6">*</tspan></text>
        <text x="105" y="60" text-anchor="middle" class="node-text">
          <tspan x="105" dy="0">The system under test,</tspan>
          <tspan x="105" dy="18">called once per example</tspan>
        </text>
      </g>

      <g id="run" transform="translate(285 76)">
        <rect class="node result" width="190" height="100" rx="18"/>
        <text x="95" y="34" text-anchor="middle" class="node-title" style="font-size:18px">Run</text>
        <text x="95" y="60" text-anchor="middle" class="node-text">
          <tspan x="95" dy="0">One per example:</tspan>
          <tspan x="95" dy="18">outputs and a trace</tspan>
        </text>
      </g>

      <g id="evaluators" transform="translate(520 76)">
        <rect class="node evaluator" width="190" height="100" rx="18"/>
        <text x="95" y="30" text-anchor="middle" class="node-title" style="font-size:18px">Evaluators</text>
        <text x="95" y="54" text-anchor="middle" class="mono-sm" style="font-size:13px">
          <tspan x="95" dy="0">schema_valid</tspan>
          <tspan x="95" dy="17">triage_accuracy</tspan>
          <tspan x="95" dy="17">summary_quality</tspan>
        </text>
      </g>

      <g id="feedback" transform="translate(755 76)">
        <rect class="node" width="195" height="100" rx="18"/>
        <text x="97" y="34" text-anchor="middle" class="node-title" style="font-size:18px">Feedback</text>
        <text x="97" y="60" text-anchor="middle" class="node-text">
          <tspan x="97" dy="0">One score per evaluator,</tspan>
          <tspan x="97" dy="18">attached to its run</tspan>
        </text>
      </g>

      <path class="edge" d="M 240 126 L 285 126"/>
      <path class="edge" d="M 475 126 L 520 126"/>
      <path class="edge" d="M 710 126 L 755 126"/>
    </g>

    <text x="550" y="596" text-anchor="middle" class="footnote"><tspan class="fnmark">*</tspan> The target is typically the agent itself, wrapped just enough to accept a dataset example and hand the evaluators what they need.</text>
  </g>
</svg>
